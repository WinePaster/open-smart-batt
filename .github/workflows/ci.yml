name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.4'
  APP_DIR: app_flutter

jobs:
  analyze-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: pub get
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get
      # 🅱️ The generated localizations must match the .arb they came from.
      #
      # WHY THIS STEP EXISTS. Commit 3e15a73 changed four strings in
      # app_{en,zh}.arb and did NOT commit the three regenerated tracked files
      # lib/l10n/app_localizations{,_en,_zh}.dart. Everything downstream then
      # read the OLD strings: three tests asserting the old wording stayed
      # green, and that batch's "2,578 all green" was a false green. Neither
      # `flutter analyze` (the stale files are valid Dart) nor `flutter test`
      # (it never runs gen-l10n) can see this — only somebody running
      # `flutter build` did, two days later.
      #
      # `flutter gen-l10n` takes no arguments here: app_flutter/l10n.yaml
      # already names arb-dir, template-arb-file and output-localization-file.
      #
      # Deliberately ONLY in this job. The ios-build job runs the same pub
      # get + analyze pair, but this check is platform-independent and running
      # it twice would just cost a macOS minute.
      - name: l10n generated files are in sync with the .arb
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter gen-l10n
          # Two questions, because `git diff` answers only one of them: a
          # CHANGED tracked file shows up there, but a file gen-l10n newly
          # CREATED (adding a locale writes app_localizations_<x>.dart) is
          # untracked and invisible to it.
          untracked="$(git ls-files --others --exclude-standard -- lib/l10n/)"
          if ! git diff --exit-code -- lib/l10n/ || [ -n "$untracked" ]; then
            [ -n "$untracked" ] && echo "untracked generated file(s): $untracked"
            echo "::error title=l10n out of sync::lib/l10n/app_localizations*.dart do not match lib/l10n/app_*.arb. Editing an .arb is only half the change: run 'flutter gen-l10n' in app_flutter/ and COMMIT the regenerated files alongside it. Until you do, flutter test keeps reading the old strings and stays green on wording that no longer ships (the 3e15a73 false green)."
            exit 1
          fi
      - name: analyze
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze
      - name: build debug APK (smoke test)
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --debug

  # iOS compile smoke test. Independent of the Android job above; added by the
  # iOS port (does NOT alter analyze-build).
  ios-build:
    name: iOS compile smoke test (compile-only)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Pin Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # TODO(maintainer): pin to the exact Xcode that ships Flutter 3.44.4's
          # toolchain once you confirm it's available on the runner image.
          # `latest-stable` avoids a missing-version failure until then.
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: pub get
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get
      - name: analyze
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze
      - name: build iOS (no codesign, compile-only)
        working-directory: ${{ env.APP_DIR }}
        run: flutter build ios --debug --no-codesign
      # IMPORTANT: compile-only. The CI runner / simulator has no Bluetooth radio,
      # so the flutter_blue_plus scan / connect / keep-alive path (the reason this
      # app exists) is NEVER exercised here. A green check does NOT mean iOS works
      # — all functional verification must come from manual on-device QA
      # (docs/ios-qa-checklist.md, needs an iPhone + a physical RCE battery).
