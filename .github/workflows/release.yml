name: Release APK

# 兩種觸發：
#   A. 一鍵自動推進 — Actions → Run workflow → 選 bump(patch/minor/major/prerelease)
#      CI 算出下一版號、**回寫 pubspec.yaml 並 commit 回分支**、再建 tag 與 Release。
#   B. 明確版號     — 先把 pubspec.yaml 的 version 改成目標版號並 commit，
#      再推 tag v*.*.*（例 git push origin v0.4.0）。版號不符會**直接失敗**。
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      bump:
        description: '版號推進方式'
        type: choice
        default: patch
        options: [patch, minor, major, prerelease]

permissions:
  contents: write   # 建立 tag / 發佈 Release / 回寫 pubspec

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # 不中斷進行中的發佈，避免 tag 競態

env:
  FLUTTER_VERSION: '3.44.4'
  APP_DIR: app_flutter

jobs:
  # ---------------------------------------------------------------------------
  # 版號單一來源。Android 與 iOS 都消費這個 job 的 output，
  # 兩平台在結構上不可能算出不同的 build number。
  # ---------------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version:    ${{ steps.ver.outputs.VERSION }}
      numeric:    ${{ steps.ver.outputs.NUMERIC }}
      tag:        ${{ steps.ver.outputs.TAG }}
      build:      ${{ steps.ver.outputs.BUILD }}
      prerelease: ${{ steps.ver.outputs.PRERELEASE }}
      sha:        ${{ steps.pubspec.outputs.SHA }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # 需要完整 tag 歷史來算下一版

      - name: 計算 versionName / build number
        id: ver
        run: |
          set -e

          # build number：日期推導、無狀態、兩平台共用。
          # 取代舊的 github.run_number（綁在單一 workflow 檔案上，改名即歸零）。
          BUILD="$(tool/build_number.sh)"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VER="${TAG#v}"
          else
            # base ONLY from stable tags (exclude -rc/-* prereleases) so prereleases
            # never out-sort or consume the next stable patch
            # pattern is written '\-' (not '-') so it can never be parsed as an
            # option; the older '-vE -- -' form breaks under non-GNU greps.
            LATEST="$(git tag -l 'v*.*.*' | grep -vE '\-' | sort -V | tail -n1)"
            LATEST="${LATEST:-v0.0.0}"
            BASE="${LATEST#v}"
            IFS='.' read -r MA MI PA <<< "$BASE"
            case "${{ github.event.inputs.bump }}" in
              major) MA=$((MA+1)); MI=0; PA=0; VER="$MA.$MI.$PA" ;;
              minor) MI=$((MI+1)); PA=0;        VER="$MA.$MI.$PA" ;;
              patch) PA=$((PA+1));              VER="$MA.$MI.$PA" ;;
              prerelease) PA=$((PA+1));         VER="$MA.$MI.$PA-rc.${BUILD}" ;;
            esac
            TAG="v${VER}"
          fi

          # CFBundleShortVersionString 只吃純數字 x.y.z，須剝除 -rc.N 後綴
          NUMERIC="${VER%%-*}"
          [ -z "$NUMERIC" ] && NUMERIC="0.0.0"

          PRE=false; [[ "$VER" == *-* ]] && PRE=true
          {
            echo "VERSION=$VER"
            echo "NUMERIC=$NUMERIC"
            echo "TAG=$TAG"
            echo "BUILD=$BUILD"
            echo "PRERELEASE=$PRE"
          } >> "$GITHUB_OUTPUT"
          echo "→ versionName=$VER  numeric=$NUMERIC  build=$BUILD  tag=$TAG  prerelease=$PRE"

      - name: 對齊 pubspec.yaml（單一真實來源）
        id: pubspec
        env:
          VER: ${{ steps.ver.outputs.VERSION }}
          TAG: ${{ steps.ver.outputs.TAG }}
        run: |
          set -e
          PUBSPEC="${APP_DIR}/pubspec.yaml"
          CURRENT="$(grep -m1 '^version:' "$PUBSPEC" | sed 's/^version:[[:space:]]*//' | cut -d+ -f1)"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # 模式 B：tag 是權威，但 pubspec 必須先被更新過。
            # 不符就失敗 —— 這正是 0.6.7+109 與 run_number 13 長期漂移的成因。
            if [ "$CURRENT" != "$VER" ]; then
              echo "::error::pubspec.yaml 版號 ($CURRENT) 與 tag ($TAG) 不符。"
              echo "::error::請先把 ${PUBSPEC} 改成 'version: ${VER}+0' 並 commit，再重推 tag。"
              exit 1
            fi
            echo "SHA=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            # 模式 A：CI 算出版號後回寫 pubspec 並 commit，確保 pubspec / tag / 產物三者一致。
            # build number 一律由建置時的 --build-number 帶入，故此處固定寫 +0，
            # 見 docs/VERSIONING.md「為什麼是 +0」。
            sed -i "s/^version:.*/version: ${VER}+0/" "$PUBSPEC"
            if git diff --quiet -- "$PUBSPEC"; then
              echo "pubspec 已是 ${VER}，無須回寫"
              echo "SHA=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            else
              git config user.name  'github-actions[bot]'
              git config user.email 'github-actions[bot]@users.noreply.github.com'
              git add "$PUBSPEC"
              git commit -m "chore(release): bump pubspec to ${VER}+0 [skip ci]"
              git push origin "HEAD:${GITHUB_REF_NAME}"
              echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            fi
          fi

  build-release:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      # A release APK MUST carry the project's own, stable key. Signing with
      # the debug key produces a fresh certificate on every CI run, and Android
      # refuses to install an update signed by a different one — so every
      # release forces an uninstall, wiping the user's history. Fail loudly
      # rather than quietly shipping another un-updatable build.
      - name: Verify Android signing secrets are complete
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [ -n "$ANDROID_KEYSTORE_BASE64" ]   || missing+=(ANDROID_KEYSTORE_BASE64)
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [ -n "$ANDROID_KEY_ALIAS" ]         || missing+=(ANDROID_KEY_ALIAS)
          [ -n "$ANDROID_KEY_PASSWORD" ]      || missing+=(ANDROID_KEY_PASSWORD)
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::缺少 Android 簽章 secret：${missing[*]}"
            echo "::error::未設定時 release 會退回 debug 簽章，產出的 APK 無法覆蓋安裝（使用者必須移除舊版、歷史全失）。"
            echo "::error::設定方式見 docs/VERSIONING.md「Android release 簽章」。"
            exit 1
          fi

      - name: Decode the release keystore (runner-only, never committed)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          # build.gradle.kts resolves storeFile against the android/ dir, so an
          # absolute path is required here.
          cat > "${APP_DIR}/android/key.properties" <<EOF
          storeFile=$KEYSTORE
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: 編譯 release APK
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter build apk --release \
            --build-name="${{ needs.version.outputs.version }}" \
            --build-number="${{ needs.version.outputs.build }}"

      # Proves the APK carries the intended key. Without this the failure mode
      # is silent: a debug-signed APK builds and uploads perfectly happily, and
      # only the user discovers it cannot be installed over their existing one.
      - name: Assert the APK is signed with the release key
        run: |
          APK="${APP_DIR}/build/app/outputs/flutter-apk/app-release.apk"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          CERTS="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK")"
          echo "$CERTS"
          # apksigner's line PREFIX varies by build-tools version:
          #   "Signer #1 certificate DN: ..."     (seen locally, build-tools 36)
          #   "V2 Signer: certificate DN: ..."    (seen on the ubuntu runner)
          # Match only the part both share, and never let a failed grep decide
          # the outcome by way of `set -e` — say what went wrong instead.
          DN="$(echo "$CERTS" | grep -m1 'certificate DN' || true)"
          if [ -z "$DN" ]; then
            echo "::error::apksigner 未輸出任何憑證資訊，無法確認簽章。"
            echo "$CERTS"
            exit 1
          fi
          if echo "$DN" | grep -qi 'CN=Android Debug'; then
            echo "::error::APK 仍是 debug 簽章（$DN）。不可發佈。"
            exit 1
          fi
          echo "✅ 簽章憑證：$DN"
          # Published in the release notes: for a sideloaded APK the signing
          # certificate is a stronger authenticity check than a file hash,
          # because it is stable across releases while the hash is not.
          CERT_SHA="$(echo "$CERTS" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}' || true)"
          echo "CERT_SHA=$CERT_SHA" >> "$GITHUB_ENV"

      - name: 重新命名 APK（含固定名 latest 供網站一鍵下載）
        run: |
          SRC="${APP_DIR}/build/app/outputs/flutter-apk/app-release.apk"
          OUT="open-smart-batt-${{ needs.version.outputs.tag }}-${{ needs.version.outputs.build }}.apk"
          cp "$SRC" "$OUT"
          sha256sum "$OUT" | tee "${OUT}.sha256"
          echo "APK=$OUT" >> "$GITHUB_ENV"
          # 固定名副本：讓散佈網站可永久直連最新穩定版 APK，免查 API／免導頁：
          #   https://github.com/WinePaster/open-smart-batt/releases/latest/download/open-smart-batt-latest.apk
          # 註：GitHub 的 /releases/latest/ 只指向最新「非 prerelease」版，故此連結自動跳過 -rc 預發版。
          # 含版本號的原檔名資產仍保留（封存／雜湊信任）；latest 只是額外副本。
          LATEST="open-smart-batt-latest.apk"
          cp "$SRC" "$LATEST"
          sha256sum "$LATEST" | tee "${LATEST}.sha256"
          echo "LATEST_APK=$LATEST" >> "$GITHUB_ENV"

      - name: 發佈 GitHub Release（含 APK）
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ needs.version.outputs.sha }}
          name: OpenSmartBatt ${{ needs.version.outputs.tag }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          generate_release_notes: true
          body: |
            社群自救版 · 非官方 · 非商業。

            本版起 APK 以專案的**固定金鑰**簽章，**可直接覆蓋更新**，歷史紀錄與
            已存裝置都會保留。

            ⚠️ **從 v0.6.8 或更早的版本升上來，這一次仍須先移除舊版。** 那些版本
            是 debug 簽章、每次發版憑證都不同，Android 不允許覆蓋。移除會清除
            歷史紀錄與已存裝置 —— 請先到「歷史 → 匯出」備份。**這是最後一次**，
            之後就能直接更新。（詳見 docs/VERSIONING.md「Android release 簽章」）

            驗證來源：簽章憑證 SHA-256 `${{ env.CERT_SHA }}`（**每一版都應相同**，
            可用 `apksigner verify --print-certs` 核對），檔案完整性則見下方 SHA256。
            或自行從原始碼編譯。

            versionName `${{ needs.version.outputs.version }}` · versionCode `${{ needs.version.outputs.build }}`
          files: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256
            ${{ env.LATEST_APK }}
            ${{ env.LATEST_APK }}.sha256

  # ---------------------------------------------------------------------------
  # iOS IPA → TestFlight。與 build-release 平行，互不阻擋。
  #
  # 這個 job 用 repo variable IOS_RELEASE_ENABLED 當開關（Settings → Variables）。
  # 未開啟時整個 job 顯示為 **skipped（灰色）**，而不是舊版的綠色 no-op ——
  # 綠燈正是 2026-07-28「以為 CI 推了 TestFlight、實際是本機手動上傳」的成因。
  # 開關打開但 secret 缺漏時，改為**大聲失敗**。
  #
  # 開啟前需在 GitHub Actions secrets 補齊：
  #   APPLE_TEAM_ID, IOS_P12_BASE64, IOS_P12_PASSWORD,
  #   IOS_MOBILEPROVISION_BASE64, ASC_KEY_ID, ASC_ISSUER_ID, ASC_API_KEY_BASE64
  # 這些一律只存在於 GitHub Actions secrets，絕不進 repo。
  # ---------------------------------------------------------------------------
  ios-ipa:
    name: iOS IPA (TestFlight)
    needs: version
    if: vars.IOS_RELEASE_ENABLED == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Verify signing secrets are complete
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          MISSING=""
          for k in APPLE_TEAM_ID IOS_P12_BASE64 IOS_P12_PASSWORD \
                   IOS_MOBILEPROVISION_BASE64 ASC_KEY_ID ASC_ISSUER_ID ASC_API_KEY_BASE64; do
            [ -z "${!k}" ] && MISSING="$MISSING $k"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::IOS_RELEASE_ENABLED=true 但缺少 secrets:$MISSING"
            echo "::error::補齊後重跑，或把 IOS_RELEASE_ENABLED 設回 false 讓此 job 顯示為 skipped。"
            exit 1
          fi

      - name: Pin Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable   # TODO(maintainer): pin to match Flutter 3.44.4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Import signing assets into a temporary keychain
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          # Decode secrets to runner-only temp files (never committed).
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$IOS_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_MOBILEPROVISION_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/dist.mobileprovision"

      - name: Inject Team ID into ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        working-directory: ${{ env.APP_DIR }}
        run: |
          # ExportOptions.plist ships with a placeholder so the real Team ID never
          # enters the public repo; inject it at build time only.
          /usr/bin/sed -i '' "s/__APPLE_TEAM_ID__/${APPLE_TEAM_ID}/" ios/ExportOptions.plist

      - name: flutter build ipa
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          flutter build ipa --release \
            --build-name="${{ needs.version.outputs.numeric }}" \
            --build-number="${{ needs.version.outputs.build }}" \
            --export-options-plist ios/ExportOptions.plist

      - name: Upload to TestFlight (App Store Connect API key)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        working-directory: ${{ env.APP_DIR }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_API_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          IPA="$(find build/ios/ipa -name '*.ipa' | head -n1)"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
